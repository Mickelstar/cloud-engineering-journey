
name: Build and Push Docker Image to ECR

on:
  push:
    branches:
      - main
    paths:
      - 'labs/apps/cloud-engineer-web/**'
      - '.github/workflows/ecr-build-push.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: cloud-engineer-web

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::483997780704:role/GitHubActions-ECR-Push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./labs/apps/cloud-engineer-web
          push: true
          tags: |
            483997780704.dkr.ecr.eu-north-1.amazonaws.com/cloud-engineer-web:${{ github.sha }}
            483997780704.dkr.ecr.eu-north-1.amazonaws.com/cloud-engineer-web:latest
